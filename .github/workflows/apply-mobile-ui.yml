name: Apply mobile study UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add mobile stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          link = '<link rel="stylesheet" href="mobile.css">'
          if link not in s:
              s = s.replace('</head>', link + '\n</head>', 1)
              p.write_text(s)
          PY
      - name: Commit patched index
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Improve mobile study UI'
          git push
